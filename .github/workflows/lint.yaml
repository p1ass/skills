name: Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  textlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 対象は .textlintrc.json と package.json の lint:text で固定する。
      # docs/ は原典の写しのため対象外。
      - name: Run textlint
        run: pnpm lint:text
